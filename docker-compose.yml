services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/irs_skyshield?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - BIFROST_API_KEY=${BIFROST_API_KEY:-sk-bf-placeholder}
      - BIFROST_BASE_URL=${BIFROST_BASE_URL:-http://192.168.16.104:8080/v1}
      - BIFROST_MODEL=${BIFROST_MODEL:-azure/claude-sonnet-4-6}
      - BIFROST_EMBEDDING_MODEL=${BIFROST_EMBEDDING_MODEL:-azure/text-embedding-ada-002}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=irs_skyshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
