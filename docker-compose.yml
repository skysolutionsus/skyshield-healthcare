services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be explicitly set for the Compose database}
      - AUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be explicitly set to a strong generated value}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be explicitly set to a strong generated value}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - BIFROST_API_KEY=${BIFROST_API_KEY:-}
      - BIFROST_BASE_URL=${BIFROST_BASE_URL:-}
      - BIFROST_MODEL=${BIFROST_MODEL:-}
      - BIFROST_TITLE_MODEL=${BIFROST_TITLE_MODEL:-}
      - BIFROST_SCSEM_MODEL=${BIFROST_SCSEM_MODEL:-}
      - BIFROST_EMBEDDING_MODEL=${BIFROST_EMBEDDING_MODEL:-}
      - CIS_LICENSE_XML_PATH=${CIS_LICENSE_XML_PATH:-}
      - CIS_LICENSE_XML_BASE64=${CIS_LICENSE_XML_BASE64:-}
      - SKYSHIELD_RUNTIME_DATA_DIR=/var/lib/skyshield
    volumes:
      - skyshield_runtime_data:/var/lib/skyshield
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly set to a strong generated value}
      - POSTGRES_DB=${POSTGRES_DB:-irs_skyshield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  skyshield_runtime_data:
